<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог машин</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--paper:#F2F4F7;--surface:#FFFFFF;--soft:#EAEDF2;--ink:#15171C;--mute:#636A78;--line:#DCE0E7;
 --lapis:#2443A6;--lapis-soft:#E4E9F8;--deal:#0E7A5C;--deal-soft:#E0F2EB;--alert:#B3361F;--alert-soft:#F8E6E2;--amber:#995C00;--amber-soft:#F7EDDC;
 --r-lg:16px;--r-md:10px;--r-sm:6px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#0F1216;--surface:#171B21;--soft:#1F242C;--ink:#E8EBF0;--mute:#9AA2B0;--line:#29303A;
 --lapis:#8EA4FF;--lapis-soft:#1F2742;--deal:#4CC393;--deal-soft:#15302A;--alert:#FF8B76;--alert-soft:#3A1E1A;--amber:#F0B55E;--amber-soft:#35290F}}
:root[data-theme=dark]{color-scheme:dark;--paper:#0F1216;--surface:#171B21;--soft:#1F242C;--ink:#E8EBF0;--mute:#9AA2B0;--line:#29303A;
 --lapis:#8EA4FF;--lapis-soft:#1F2742;--deal:#4CC393;--deal-soft:#15302A;--alert:#FF8B76;--alert-soft:#3A1E1A;--amber:#F0B55E;--amber-soft:#35290F}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums}
a{color:var(--lapis);text-decoration:none}a:hover{text-decoration:underline}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lapis);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px}

/* шапка */
.top{padding:22px 0 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.top .upd{color:var(--mute);font-size:13px}
.warnline{background:var(--amber-soft);color:var(--amber);border-radius:var(--r-md);padding:8px 12px;font-size:13px;margin-bottom:10px}
.nav{position:sticky;top:0;z-index:10;background:var(--paper);padding:8px 0 10px;border-bottom:1px solid var(--line)}
.nav .wrap{overflow-x:auto;scrollbar-width:none}.nav .wrap::-webkit-scrollbar{display:none}
.simlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.simrow{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-top:1px solid var(--line);color:var(--ink);font-size:14px}
.simrow:first-child{border-top:0}.simrow:hover{background:var(--soft);text-decoration:none}
.mitem{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;margin:10px 0}
.mitem .th{width:84px;aspect-ratio:3/2;flex:none;border-radius:var(--r-sm);background:var(--soft) center/cover no-repeat}
.mitem .mt{color:var(--ink);font-weight:700}.mitem .ms{color:var(--mute);font-size:14px}
.plats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.plat{border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap}
.plat.lo{background:var(--deal-soft);border-color:var(--deal);color:var(--deal)}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--mute)}
.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #0000001a}
.seg button .c{font-weight:500;color:var(--mute);margin-left:4px}

/* фильтры */
.quick{display:flex;gap:6px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qc{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap}
.qc span{color:var(--mute);font-weight:500;margin-left:5px}
.qc[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.qc[aria-pressed=true] span{color:inherit;opacity:.7}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 0 4px}
.controls select,.more select,.more input[type=number]{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-md);padding:7px 10px;font-size:14px;height:36px}
.more input::placeholder{color:var(--mute);opacity:.8}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:7px 13px;cursor:pointer;font-size:14px;font-weight:600}
.btn.pri{background:var(--lapis);border-color:var(--lapis);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mute)}
.more{display:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;margin:6px 0 2px;font-size:14px}
.more.open{display:block}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 18px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;color:var(--mute);font-weight:600}
.field select{width:100%}
.range{display:flex;align-items:center;gap:6px}.range input{width:100%;min-width:0}.range i{color:var(--mute);font-style:normal}
.checks{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.checks label{display:flex;align-items:center;gap:7px;cursor:pointer}
.checks input{width:16px;height:16px;accent-color:var(--lapis)}
.mfoot{display:flex;justify-content:flex-end;margin-top:10px}
.more input[type=number]{-moz-appearance:textfield;appearance:textfield}
.more input[type=number]::-webkit-inner-spin-button,.more input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.count{color:var(--mute);font-size:13px;padding:8px 0 2px}

/* карточки */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:18px;padding:10px 0 100px}
.car{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;border:1px solid var(--line)}
.car:hover{border-color:color-mix(in srgb,var(--lapis) 45%,var(--line))}
.photo{aspect-ratio:3/2;background:var(--soft) center/cover no-repeat;position:relative}
.photo.none{display:grid;place-items:center;color:var(--mute);font-size:13px}
.score{position:absolute;left:10px;top:10px;min-width:38px;height:28px;padding:0 9px;border-radius:99px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface);color:var(--ink)}
.score.hi{background:var(--deal);color:#fff}.score.lo{background:var(--alert);color:#fff}
.pcount{position:absolute;right:10px;bottom:10px;background:#000a;color:#fff;font-size:12px;padding:2px 8px;border-radius:99px}
.cmpb{position:absolute;right:10px;top:10px;border:0;border-radius:99px;background:#000a;color:#fff;font-size:12px;font-weight:600;padding:4px 10px;cursor:pointer}
.cmpb[aria-pressed=true]{background:var(--lapis)}
.info{padding:13px 15px 15px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{margin:0;font-size:16px;font-weight:700;line-height:1.3}
.specs{margin:0;color:var(--mute);font-size:14px}
.pr{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.pr b{font-size:23px;font-weight:800;letter-spacing:-.01em}
.dl{font-size:14px;font-weight:700}
.good{color:var(--deal)}.bad{color:var(--alert)}.warn{color:var(--amber)}.muted{color:var(--mute)}
.meter{position:relative;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--deal-soft),var(--soft) 50%,var(--alert-soft));margin:4px 0 0}
.meter i{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--surface)}
.meter::after{content:"";position:absolute;left:50%;top:-3px;width:2px;height:12px;background:var(--mute);opacity:.5}
.mcap{font-size:12px;color:var(--mute)}
.flags{display:flex;gap:5px;flex-wrap:wrap}
.flag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--mute)}
.flag.a{background:var(--alert-soft);color:var(--alert)}.flag.w{background:var(--amber-soft);color:var(--amber)}.flag.g{background:var(--deal-soft);color:var(--deal)}.flag.b{background:var(--lapis-soft);color:var(--lapis)}
.money{margin:auto 0 0;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.money b{font-weight:700}
.empty{padding:48px 0;color:var(--mute);max-width:560px}

/* сравнение */
.cmpbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:14px;padding:9px 10px 9px 16px;display:none;gap:10px;align-items:center;z-index:20;box-shadow:0 8px 24px #0004}
.cmpbar .btn{border:0}

/* окно машины */
.modal{position:fixed;inset:0;background:#0009;display:none;z-index:30;overflow:auto;padding:28px 16px}
.modal.open{display:block}
.sheet{background:var(--surface);max-width:1000px;margin:0 auto;border-radius:20px;overflow:hidden;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.shead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:18px 22px 0}
.shead h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em}
.shead .pr b{font-size:27px}
.x{border:0;background:var(--soft);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;flex:none}
.stabs{display:flex;gap:4px;padding:14px 22px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.stabs button{border:0;background:none;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.stabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--lapis)}
.spane{padding:20px 22px 24px}
.two{display:grid;grid-template-columns:1.15fr 1fr;gap:26px}
.gal .main{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;background:var(--soft);display:block}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:66px;height:46px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.6}
.thumbs img.on,.thumbs img:hover{opacity:1}
.facts{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:0;font-size:14px}
.facts dt{color:var(--mute)}.facts dd{margin:0;font-weight:600}
h4{margin:22px 0 8px;font-size:15px;font-weight:700}
h4:first-child{margin-top:0}
.note{background:var(--soft);border-radius:var(--r-md);padding:10px 13px;font-size:14px}
.note.w{background:var(--amber-soft);color:var(--amber)}.note.g{background:var(--deal-soft);color:var(--ink)}.note.g b{color:var(--deal)}.note.a{background:var(--alert-soft);color:var(--alert)}
.why{list-style:none;padding:0;margin:0;font-size:14px}.why li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.why li b{min-width:34px;text-align:right}
.desc{white-space:pre-wrap;font-size:14px;color:var(--mute);background:var(--soft);padding:12px 14px;border-radius:var(--r-md);max-height:320px;overflow:auto}
ol.check{padding-left:20px;margin:0}ol.check li{margin:6px 0}
.mrow{display:flex;gap:6px;flex-wrap:wrap;padding:12px 22px 0}
.ihead{margin:22px 0 8px;font-size:16px}.ihead .muted{font-weight:400;font-size:14px}
.itbl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.irow{display:grid;grid-template-columns:2fr 1.3fr 1.3fr .8fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line);color:var(--ink);font-size:14px;align-items:center}
.irow:first-child{border-top:0}.irow:hover{background:var(--soft);text-decoration:none}.irow small{display:block;color:var(--mute);font-size:12.5px}
.irow.best{background:var(--deal-soft)}.irate{font-weight:700;text-align:right}.iname{min-width:0}
@media (max-width:640px){.irow{grid-template-columns:1fr 1fr}.irate{text-align:left}}
.iq{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.iqb{display:flex;gap:6px;flex:none}.iqb button{width:40px;height:34px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;font-size:16px;font-weight:700}
.iqb button[aria-pressed=true]{background:var(--deal-soft);border-color:var(--deal);color:var(--deal)}
.iqb button.bad[aria-pressed=true]{background:var(--alert-soft);border-color:var(--alert);color:var(--alert)}
.srch{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.srch:first-child{border-top:0}.srch .btn{padding:4px 10px;font-size:13px}
.mb{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:14px;font-weight:600}
.note-in{display:block;width:calc(100% - 44px);margin:10px 22px 0;min-height:44px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--ink);padding:8px 10px;font:inherit;font-size:14px;resize:vertical}
.mb[aria-pressed=true]{background:var(--lapis-soft);border-color:var(--lapis);color:var(--lapis)}
.sendbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--lapis);color:#fff;border-radius:14px;padding:9px 10px 9px 16px;display:none;gap:10px;align-items:center;z-index:25;box-shadow:0 8px 24px #0004;max-width:calc(100% - 24px)}
.sendbar .btn{border:0}
.sfoot{display:flex;gap:8px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface);position:sticky;bottom:0}
svg text{fill:var(--mute);font-size:10px;font-family:inherit}

/* деньги */
.fsum{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.ledger{width:100%;border-collapse:collapse;font-size:14px}
.ledger td{padding:6px 0;border-bottom:1px solid var(--line)}
.ledger td:last-child{text-align:right;font-weight:600;white-space:nowrap}
.ledger tr.tot td{font-weight:800;border-bottom:0;padding-top:9px;font-size:15px}
.ledger tr.sub td{color:var(--mute)}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--soft);margin:10px 0 6px}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}
.big{font-size:22px;font-weight:800;margin:2px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:right;font-weight:600;color:var(--mute);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px}
.tbl td{text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.pick td{background:var(--lapis-soft)}
.tbl tbody tr.sel{cursor:pointer}.tbl tbody tr.sel:hover td{background:var(--soft)}
.tbl tr.pick:hover td{background:var(--lapis-soft)}
.scroll{overflow:auto}
.sched{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-md)}
.sched .tbl th{position:sticky;top:0;background:var(--surface)}
.sched tr.end td{font-weight:800}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.cond{display:none;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 16px;background:var(--soft);border-radius:var(--r-md);padding:12px 14px;margin:0 0 6px;font-size:13px}
.cond.open{display:grid}
.cond label{display:flex;flex-direction:column;gap:4px;color:var(--mute)}
.cond input{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:6px 8px;font-size:14px;color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row input[type=number]{width:110px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:6px 8px}
.fine{font-size:12px;color:var(--mute);margin-top:16px;line-height:1.55}

/* рынок */
.mk{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:18px;padding:16px 0 60px}
.mpanel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px}
.mpanel h3{margin:0;font-size:18px;font-weight:800;display:flex;gap:8px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 6px}
.stats div{background:var(--soft);border-radius:var(--r-md);padding:9px 11px}
.stats b{display:block;font-size:19px;font-weight:800}.stats span{font-size:12px;color:var(--mute)}
details{margin-top:10px}summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--lapis)}
.mini{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}.mini td{padding:5px 4px;border-bottom:1px solid var(--line)}
.mini td:nth-child(2){text-align:right;font-weight:600}
.deal{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}

@media (max-width:760px){
 .wrap{padding:0 14px}.top h1{font-size:22px}
 .grid{grid-template-columns:1fr 1fr;gap:10px}.info{padding:10px 11px 12px}.info h3{font-size:14px}.pr b{font-size:19px}.specs{font-size:13px}
 .modal{padding:0}.sheet{border-radius:0;min-height:100%}.two,.fsum{grid-template-columns:1fr}.shead,.stabs,.spane,.sfoot,.mrow{padding-left:14px;padding-right:14px}
 .mk{grid-template-columns:1fr}
}
@media (max-width:560px){
 .grid{grid-template-columns:1fr;gap:10px}.car{flex-direction:row}.photo{width:38%;flex:none;aspect-ratio:auto;min-height:168px}
 .score{left:6px;top:6px;height:24px;min-width:32px;font-size:13px}.cmpb{top:auto;bottom:6px;right:auto;left:6px;font-size:11px;padding:3px 8px}.pcount{display:none}
 .info{gap:4px}.mcap{display:none}.money{padding-top:6px;font-size:12px}
 .fgrid{grid-template-columns:1fr 1fr;gap:12px}.more{padding:14px}.checks{gap:10px 16px}
 .controls select{flex:1 1 46%;min-width:0}.controls .btn{flex:1 1 46%}.top{padding-top:16px}
}
</style><meta name="robots" content="noindex,nofollow">

</head><body>
<div class="wrap">
 <div class="top"><h1>Подбор машины</h1><div class="upd" id="upd"></div></div>
 <div id="warn"></div>
</div>
<div class="nav"><div class="wrap"><div class="seg" role="tablist" id="views">
 <button role="tab" data-v="pick" aria-selected="true">Подборка<span class="c" id="c-pick"></span></button>
 <button role="tab" data-v="market" aria-selected="false">Рынок</button>
 <button role="tab" data-v="fav" aria-selected="false">Отмеченные<span class="c" id="c-fav"></span></button>
 <button role="tab" data-v="multi" aria-selected="false">На разных площадках<span class="c" id="c-multi"></span></button>
 <button role="tab" data-v="inst" aria-selected="false" id="t-inst" hidden>Рассрочки<span class="c" id="c-inst"></span></button>
</div></div></div>

<main class="wrap">
 <section id="v-pick">
  <div class="quick" id="quick"></div>
  <div class="controls">
   <select id="f-scope" aria-label="Какие машины показывать">
    <option value="">Подходят и почти</option><option value="match">Только подходят</option><option value="all">Все модели, включая рынок</option><option value="market">Только рынок</option>
   </select>
   <select id="f-model" aria-label="Модель"><option value="">Все модели</option></select>
   <select id="f-sort" aria-label="Сортировка">
    <option value="score">Сначала выгодные</option><option value="delta">Дешевле справедливой</option><option value="price">Сначала дешёвые</option><option value="new">Сначала новые</option><option value="km">Меньше пробег</option>
   </select>
   <button class="btn" id="morebtn" aria-expanded="false">Фильтры</button>
  </div>
  <div class="more" id="more">
   <div class="fgrid">

    <label class="field"><span>В продаже</span><select id="f-days"><option value="">Сколько угодно</option><option value="1">Со вчерашнего дня</option><option value="3">До 3 дней</option><option value="7">До недели</option><option value="30">До месяца</option></select></label>

<script type="text/plain" id="app">
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>v?'$'+Number(v).toLocaleString('ru-RU'):'—';
const num=v=>Number(v).toLocaleString('ru-RU');
const mln=(v,d=2)=>Number(v).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
const km=v=>v?(v>=1000?Math.round(v/1000)+' тыс. км':num(v)+' км'):'пробег не указан';
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return n+' '+(m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c)};
const MARKS={fav:'В избранном',called:'Звонил',seen:'Смотрел',no:'Отказ'};
// каталог в боте (мини-апп): отметки ставятся прямо здесь и уходят боту — см. catalog.py
const CAT=window.CAT||null, MARK_BTNS={fav:'⭐ Избранное',called:'📞 Звонил',seen:'👀 Смотрел',no:'❌ Отказ',hide:'🙈 Скрыть'};
/* «новое с прошлого раза»: сравниваем с тем, что было в предыдущей версии отчёта, которую открывали на этом устройстве */
try{const K='carmon_seen',st=JSON.parse(localStorage.getItem(K)||'{}');
 if(st.updated!==UPDATED){st.prev=st.cur||null;st.cur=Object.fromEntries(DATA.map(r=>[r.key,r.price_usd||0]));st.updated=UPDATED;localStorage.setItem(K,JSON.stringify(st))}
 if(st.prev)DATA.forEach(r=>{const was=st.prev[r.key];if(was===undefined)r.new_me=true;else if(was&&r.price_usd&&r.price_usd<was)r.cheaper_me=was-r.price_usd})}catch(e){}
const pick=DATA.filter(r=>r.status!=='Рынок'), mkt=DATA.filter(r=>r.status==='Рынок');
const cmp=new Set(); let quick='';

/* ───────── шапка ───────── */
$('upd').textContent='Обновлено '+UPDATED+(STATS.usd_rate?', курс '+num(Math.round(STATS.usd_rate))+' сум':'');
{const m=/^(\d\d)\.(\d\d)\.(\d{4}) (\d\d):(\d\d)/.exec(UPDATED);   // давно не запускали сбор — сказать прямо
 if(m){const age=Math.floor((Date.now()-new Date(+m[3],m[2]-1,+m[1],+m[4],+m[5]))/864e5);
  if(age>=2)$('warn').insertAdjacentHTML('afterbegin',`<div class="warnline">Данные от ${esc(UPDATED.slice(0,10))}, это ${plural(age,'день','дня','дней')} назад. Запустите сбор (run_monitor.bat), чтобы увидеть свежие объявления и цены.</div>`)}}
const bad=Object.entries(STATS.sources||{}).filter(([k,v])=>!String(v).startsWith('ok'));
if(bad.length)$('warn').innerHTML=`<div class="warnline">Не удалось обновить: ${bad.map(([k,v])=>esc(k)+' ('+esc(v)+')').join(', ')}. Показаны данные с прошлых запусков.</div>`;
(STATS.warnings||[]).forEach(w=>$('warn').insertAdjacentHTML('beforeend',`<div class="warnline">${esc(w)}</div>`));
[...new Set(DATA.map(r=>r.model_title))].sort().forEach(m=>$('f-model').insertAdjacentHTML('beforeend',`<option>${esc(m)}</option>`));
const multiRows=()=>DATA.map((r,i)=>[r,i]).filter(([r])=>(r.platforms||[]).length>1&&!(r.marks||[]).some(m=>m==='no'||m==='hide'));
$('c-multi').textContent=multiRows().length||'';
const instRows=()=>DATA.map((r,i)=>[r,i]).filter(([r])=>r.inst&&r.inst.months&&!(r.marks||[]).some(m=>m==='no'||m==='hide'));
{const n=instRows().length;$('c-inst').textContent=n||'';$('t-inst').hidden=!n}
$('c-pick').textContent=pick.length;const favN=DATA.filter(r=>(r.marks||[]).length).length;$('c-fav').textContent=favN||'';

/* ───────── карточка ───────── */
function specs(r){return [r.year,km(r.km),r.gearbox,r.gas?'газ':'',r.owners?plural(+r.owners,'хозяин','хозяина','хозяев'):''].filter(Boolean).join(', ')}
/* ───────── осмотр: чек-лист на авторынке ───────── */
const INSP=[['Кузов',[['k1','Зазоры между деталями ровные, оттенок одинаковый'],['k2','Толщиномер: родная краска (до ~150 мкм)'],['k3','Нет ржавчины: пороги, арки, низ дверей'],['k4','Стёкла и фары родные (одна маркировка)'],['k5','Лонжероны, стойки и багажник без следов ремонта']]],
 ['Двигатель',[['d1','Холодный запуск без стуков, дыма и троения'],['d2','Нет течей масла и антифриза'],['d3','Масло без эмульсии (крышка, щуп)'],['d4','Ровные обороты на холостых'],['d5','Check Engine не горит, ошибок нет']]],
 ['Коробка и ходовая',[['h1','Переключения без рывков и пинков'],['h2','Сцепление не буксует (механика)'],['h3','Руль без люфта, машину не уводит'],['h4','Подвеска не стучит на кочках'],['h5','Тормоза без вибрации и скрипа']]],
 ['Салон и электрика',[['s1','Кондиционер холодит'],['s2','Печка греет'],['s3','Износ руля, педалей и сиденья сходится с пробегом'],['s4','Стеклоподъёмники, фары и приборы работают']]],
 ['Документы',[['t1','Техпаспорт на продавца или нотариальная доверенность'],['t2','Номер кузова совпадает с техпаспортом'],['t3','Нет залога и запрета на регистрацию'],['t4','Газ (если стоит) вписан в техпаспорт']]]];
const INSP_T=Object.fromEntries(INSP.flatMap(([,it])=>it));
function inspLocal(){try{return JSON.parse(localStorage.getItem('carmon_insp')||'{}')}catch(e){return {}}}
function inspGet(r){return r.insp||inspLocal()[r.key]||null}
function inspSave(r,d){const empty=!d||(!Object.keys(d.v||{}).length&&!(d.n||'').trim());r.insp=empty?null:d;
 try{const a=inspLocal();if(empty)delete a[r.key];else a[r.key]=d;localStorage.setItem('carmon_insp',JSON.stringify(a))}catch(e){}
 if(CAT&&CAT.insp)CAT.insp(r,empty?null:d)}
function inspSum(r){const d=inspGet(r);if(!d)return null;const e=Object.entries(d.v||{});
 return {ok:e.filter(([,x])=>x===1).length,bad:e.filter(([,x])=>x===2).map(([k])=>INSP_T[k]).filter(Boolean),n:d.n||''}}
function inspNote(r){const s=inspSum(r);if(!s)return '';
 return `<div class="note ${s.bad.length?'a':'g'}" style="margin-bottom:12px"><b>Осмотр:</b> в порядке ${s.ok}, проблем ${s.bad.length}${s.bad.length?'<div style="margin-top:4px">'+s.bad.map(x=>'✗ '+esc(x)).join('<br>')+'</div>':''}${s.n?`<div style="margin-top:4px">${esc(s.n)}</div>`:''} <a href="#" onclick="showTab('insp');return false">Открыть</a></div>`}
function inspPane(r){const d=inspGet(r)||{v:{},n:''};
 return `<p class="fine" style="margin:0 0 8px">Отмечайте прямо на осмотре: ✓ — в порядке, ✗ — проблема; нажмите ещё раз, чтобы снять. ${CAT?'Сохраняется в облаке Telegram и видно на всех ваших устройствах.':'Сохраняется в этом браузере.'} Осмотренные машины попадают во вкладку «Отмеченные».</p>`
  +INSP.map(([g,items])=>`<h4 style="margin:16px 0 4px">${g}</h4>`+items.map(([id,t])=>`<div class="iq"><span>${t}</span><span class="iqb"><button data-iq="${id}" data-iv="1" aria-pressed="${d.v[id]===1}" aria-label="В порядке">✓</button><button class="bad" data-iq="${id}" data-iv="2" aria-pressed="${d.v[id]===2}" aria-label="Проблема">✗</button></span></div>`).join('')).join('')
  +`<textarea class="note-in" id="inote" style="width:100%;margin:14px 0 0" placeholder="Что ещё заметили: стук справа спереди, торг до…" aria-label="Заметки осмотра">${esc(d.n||'')}</textarea>`}
function bindInsp(r){const cur=()=>{const d=inspGet(r);return {v:{...((d&&d.v)||{})},n:(d&&d.n)||''}};
 $('pane').querySelectorAll('[data-iq]').forEach(b=>b.onclick=()=>{const d=cur(),id=b.dataset.iq,v=+b.dataset.iv;
  if(d.v[id]===v)delete d.v[id];else d.v[id]=v;inspSave(r,d);
  $('pane').querySelectorAll(`[data-iq="${id}"]`).forEach(x=>x.setAttribute('aria-pressed',d.v[id]===+x.dataset.iv))});
 const n=$('inote');let t;const save=()=>{const d=cur();d.n=n.value.trim().slice(0,600);inspSave(r,d)};
 n.oninput=()=>{clearTimeout(t);t=setTimeout(save,600)};n.onblur=()=>{clearTimeout(t);save()}}
function flags(r){const f=[];
 if(r.new_me)f.push(['b','Новое для вас']);if(r.cheaper_me)f.push(['g','−$'+num(r.cheaper_me)+' с прошлого раза']);
 if(r.reseller)f.push(['a','Перекуп']);if(r.photo_dupe)f.push(['a','Фото у другого номера']);if(r.ripe)f.push(['w','Готов торговаться']);if(r.dropped)f.push(['g','Цена снижена']);
 if(r.is_new)f.push(['b','Новое']);if(r.low_km)f.push(['w','Проверить пробег']);if(r.status==='Почти подходит')f.push(['','Почти подходит']);if((r.terms||[]).some(t=>INST.includes(t)))f.push(['a','Цена не полная']);
 if(r.status==='Рынок')f.push(['','Рынок']);(r.marks||[]).forEach(m=>MARKS[m]&&f.push(['',MARKS[m]]));if(r.note)f.push(['','📝 '+(r.note.length>24?r.note.slice(0,24)+'…':r.note)]);
 const is=inspSum(r);if(is)f.push([is.bad.length?'a':'g','Осмотр: ✓'+is.ok+(is.bad.length?' ✗'+is.bad.length:'')]);return f}
function flagsHtml(r,max){const f=flags(r);const s=f.slice(0,max||9).map(([c,t])=>`<span class="flag ${c}">${t}</span>`).join('');return s+(max&&f.length>max?`<span class="flag">+${f.length-max}</span>`:'')}
function deltaTxt(r){if(r.delta==null)return '';const c=r.delta<=-3?'good':r.delta>=5?'bad':'muted';return `<span class="dl ${c}">${r.delta>0?'+':'−'}${Math.abs(r.delta)}%</span>`}
function meter(r){if(r.delta==null)return '';const p=Math.max(3,Math.min(97,50+r.delta*2.5));const col=r.delta<=-3?'var(--deal)':r.delta>=5?'var(--alert)':'var(--mute)';
 return `<div class="meter" title="Цена относительно справедливой"><i style="left:${p}%;background:${col}"></i></div><div class="mcap">Справедливая цена ${money(r.market)}</div>`}
function moneyLine(r){if(r.left===''||r.left==null)return '';const l=+r.left;
 return `<p class="money">${l>=0?`Займа хватит, останется <b class="good">${mln(l,1)} млн</b>`:`На машину не хватит <b class="bad">${mln(-l,1)} млн</b>`}</p>`}
function scoreCls(s){return s>=65?'hi':s<40?'lo':''}
function cardHtml(r,i){
 const ph=r.photo?`class="photo" style="background-image:url('${esc(r.photo)}')"`:'class="photo none"';
 return `<article class="car" tabindex="0" data-i="${i}" aria-label="${esc(r.title)} ${esc(r.year||'')}">
 <div ${ph}>${r.photo?'':'Нет фото'}<span class="score ${scoreCls(r.score)}" title="Оценка выгодности из 100">${r.score}</span>
  <button class="cmpb" aria-pressed="${cmp.has(i)}" data-cmp="${i}">${cmp.has(i)?'В сравнении':'Сравнить'}</button>
  ${(r.photos||[]).length>1?`<span class="pcount">${r.photos.length} фото</span>`:''}</div>
 <div class="info"><h3>${esc(r.title)}</h3><p class="specs">${esc(specs(r))}</p>
  <div class="pr"><b>${money(r.price_usd)}</b>${deltaTxt(r)}</div>${meter(r)}
  <div class="flags">${flagsHtml(r,2)}</div>${moneyLine(r)}</div></article>`}
function bindCards(root){root.querySelectorAll('.car').forEach(el=>{el.onclick=e=>{const b=e.target.closest('[data-cmp]');if(b){e.stopPropagation();toggleCmp(+b.dataset.cmp);return}openCard(+el.dataset.i)};
 el.onkeydown=e=>{if(e.key==='Enter'){openCard(+el.dataset.i)}}})}

/* ───────── подборка ───────── */
const INST=['Аренда','Рассрочка','Рассрочка?'];
const QUICK=[['','Все',r=>true],['mine','Новое для вас',r=>r.new_me||r.cheaper_me],['match','Подходят',r=>r.status==='Подходит'],['new','Новые',r=>r.is_new],['drop','Снизили цену',r=>r.dropped],['ripe','Готовы торговаться',r=>r.ripe],['fit','Хватает займа',r=>r.fits]];
function base(){const fs=$('f-scope').value,fm=$('f-model').value;
 let src=fs==='all'?DATA:fs==='market'?mkt:(fm&&!pick.some(r=>r.model_title===fm)?mkt:pick);
 let rows=src.map(r=>[r,DATA.indexOf(r)]);
 if(fm)rows=rows.filter(([r])=>r.model_title===fm);if(fs==='match')rows=rows.filter(([r])=>r.status==='Подходит');
 const v=id=>$(id).value,n=id=>$(id).value===''?null:+$(id).value,c=id=>$(id).checked,F=[];
 const y1=n('f-y1'),y2=n('f-y2'),p1=n('f-p1'),p2=n('f-price'),k1=n('f-k1'),k2=n('f-k2'),own=n('f-own'),days=n('f-days');
 if(y1!=null)F.push(r=>r.year&&r.year>=y1);if(y2!=null)F.push(r=>r.year&&r.year<=y2);
 if(p1!=null)F.push(r=>r.price_usd&&r.price_usd>=p1);if(p2!=null)F.push(r=>r.price_usd&&r.price_usd<=p2);
 if(k1!=null)F.push(r=>r.km&&r.km>=k1*1000);if(k2!=null)F.push(r=>r.km&&r.km<=k2*1000);
 if(v('f-gb'))F.push(r=>r.gearbox_code===v('f-gb'));if(own!=null)F.push(r=>r.owners&&+r.owners<=own);
 if(v('f-src')==='__dealer')F.push(r=>r.dealer);
 else if(v('f-src')==='__nodealer')F.push(r=>!r.dealer);
 else if(v('f-src'))F.push(r=>r.source===v('f-src')||(r.others_links||[]).some(o=>o.name===v('f-src')));
 if(days!=null)F.push(r=>r.days!=null&&r.days<=days);
 const ft=v('f-terms'),tm=r=>r.terms||[];
 if(ft==='noinst')F.push(r=>!tm(r).some(t=>INST.includes(t)));if(ft==='clean')F.push(r=>!tm(r).length);if(ft==='only')F.push(r=>tm(r).length>0);
 if(c('f-gas'))F.push(r=>!r.gas);if(c('f-res'))F.push(r=>!r.reseller);
 if(c('f-native'))F.push(r=>r.paint_state==='native');if(c('f-noacc'))F.push(r=>!r.accident);
 if(c('f-photo'))F.push(r=>r.photo);if(c('f-tel'))F.push(r=>r.contact_tel);
 rows=rows.filter(([r])=>F.every(f=>f(r)));
 return rows.filter(([r])=>!(r.marks||[]).some(m=>m==='no'||m==='hide'))}
function render(){const b=base();
 $('quick').innerHTML=QUICK.filter(([k,t,f])=>!k||quick===k||b.some(([r])=>f(r))).map(([k,t,f])=>`<button class="qc" aria-pressed="${quick===k}" data-q="${k}">${t}<span>${b.filter(([r])=>f(r)).length}</span></button>`).join('');
 $('quick').querySelectorAll('.qc').forEach(el=>el.onclick=()=>{quick=el.dataset.q;render()});
 let rows=b.filter(([r])=>QUICK.find(q=>q[0]===quick)[2](r));
 const s=$('f-sort').value;
 rows.sort(([a],[c])=>s==='price'?(a.price_usd||1e9)-(c.price_usd||1e9):s==='km'?(a.km||1e9)-(c.km||1e9):s==='new'?String(c.first_seen).localeCompare(String(a.first_seen)):s==='delta'?((a.delta??99)-(c.delta??99)):(c.score-a.score));
 const nf=FILTERS.filter(id=>id!=='f-res'&&($(id).type==='checkbox'?$(id).checked:$(id).value!=='')).length+($('f-res').checked?0:1);
 saveFilters();
 $('morebtn').textContent=nf?`Фильтры (${nf})`:'Фильтры';
 $('count').textContent=rows.length?'Показано: '+plural(rows.length,'машина','машины','машин'):'';
 $('grid').innerHTML=rows.length?rows.map(([r,i])=>cardHtml(r,i)).join(''):'<div class="empty">Под эти условия машин нет. Снимите часть фильтров или выберите «Все модели, включая рынок».</div>';
 bindCards($('grid'))}
function markRow(r){if(!CAT||!r.rid)return '';const ms=r.marks||[];
 return `<div class="mrow">${Object.entries(MARK_BTNS).map(([m,t])=>`<button class="mb" aria-pressed="${ms.includes(m)}" data-mark="${m}">${t}</button>`).join('')}</div>
 <textarea class="note-in" id="note" placeholder="Заметка: звонил, торг до…, смотреть в субботу" aria-label="Заметка">${esc(r.note||'')}</textarea>`}
function shareCar(i){const r=DATA[i];const text=`${r.title} ${r.year||''}, ${km(r.km)}, ${money(r.price_usd)}`+(r.market?` (справедливая ${money(r.market)})`:'');
 const u='https://t.me/share/url?url='+encodeURIComponent(r.url)+'&text='+encodeURIComponent(text);
 if(CAT)return CAT.open(u);if(navigator.share)return navigator.share({title:r.title,text,url:r.url}).catch(()=>{});window.open(u,'_blank')}
function bindMarks(r){const n=$('note');if(n){let t;n.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{r.note=n.value.trim();CAT.note(r,r.note)},600)};
  n.onblur=()=>{clearTimeout(t);if((r.note||'')!==n.value.trim()){r.note=n.value.trim();CAT.note(r,r.note);render()}}}
 $('sheet').querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>{const m=b.dataset.mark,on=!(r.marks||[]).includes(m);

function schedule(f,n,pay,pre){const r=f.microloan_rate/1200;let bal=f.microloan_amount_mln-(pre||0);const mand=pmt(f.microloan_rate,n,bal);const p=Math.max(mand,pay||0);const rows=[];
 for(let k=1;k<=n&&bal>1e-6;k++){const it=bal*r;const pp=Math.min(p,bal+it);const pr=pp-it;bal=Math.max(0,bal-pr);rows.push({k,pay:pp,int:it,prin:pr,bal})}return {rows,mand}}
function irr(net,flows){let lo=0,hi=.2;for(let j=0;j<80;j++){const m=(lo+hi)/2;const pv=flows.reduce((s,c,k)=>s+c/Math.pow(1+m,k+1),0);if(pv>net)lo=m;else hi=m}return (Math.pow(1+(lo+hi)/2,12)-1)*100}

  +rows.map(([r,i])=>{const ps=[...r.platforms].sort((x,y)=>(x.price||1e9)-(y.price||1e9)),lo=ps[0].price;
   return `<div class="mitem"><div class="th" style="${r.photo?`background-image:url('${esc(r.photo)}')`:''}"></div><div style="min-width:0">
    <a href="#" class="mt" data-open="${i}">${esc(r.title)}</a><div class="ms">${esc(specs(r))} · ${esc(r.status)}</div>
    <div class="plats">${ps.map(p=>`<a class="plat${p.price&&p.price===lo?' lo':''}" href="${esc(p.url)}" target="_blank">${esc(p.name)} ${money(p.price)}${p.price&&lo&&p.price>lo?` <span class="bad">+$${num(p.price-lo)}</span>`:''}</a>`).join('')}</div></div></div>`}).join('')
  :'<div class="empty">Пока ни одна машина не найдена сразу на нескольких площадках.</div>';
 $('multi').querySelectorAll('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();openCard(+a.dataset.open)})}

/* ───────── рассрочки ───────── */
function renderInst(){const groups={};instRows().forEach(x=>{const g=(x[0].model_title||'')+' '+(x[0].year||'');(groups[g]=groups[g]||[]).push(x)});
 const val=r=>r.inst.rate!=null?r.inst.rate:r.inst.over_pct!=null?1000+r.inst.over_pct:1e9;
 const keys=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length||a.localeCompare(b));
 $('inst').innerHTML=`<p class="muted" style="font-size:14px;margin:6px 0 0">Предложения с рассрочкой, аренды с выкупом и дилеров, где в тексте есть взнос, платёж и срок. Внутри модели и года сверху самые выгодные: по ставке годовых, считая от рыночной цены машины. Зелёным отмечено лучшее.</p>`
  +keys.map(g=>{const rows=groups[g].sort(([a],[b])=>val(a)-val(b));
   return `<h3 class="ihead">${esc(g)} <span class="muted">${rows.length}</span></h3><div class="itbl">`+rows.map(([r,i],j)=>{const c=r.inst;
    return `<a href="#" class="irow${j===0&&c.rate!=null&&rows.length>1?' best':''}" data-open="${i}"><span class="iname">${esc(r.title)}<small>${esc(r.source||'')}${r.km?', '+km(r.km):''}</small></span>
     <span>${c.up!=null?'взнос '+money(c.up):'взнос не указан'}<small>${c.months} × ${money(c.monthly)}</small></span>
     <span>${c.total!=null?'<b>'+money(c.total)+'</b>':'—'}<small>${c.over!=null?(c.over>0?'переплата '+money(c.over)+' ('+c.over_pct+'%)':'без переплаты'):'итог неизвестен'}</small></span>
     <span class="irate">${c.rate!=null?c.rate+'%':'—'}<small>годовых</small></span></a>`}).join('')+'</div>'}).join('');
 $('inst').querySelectorAll('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();openCard(+a.dataset.open)})}

/* ───────── вкладки ───────── */
function setView(v){document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
 ['pick','market','fav','multi','inst'].forEach(x=>$('v-'+x).hidden=x!==v);$('cmpbar').style.display=(v!=='market'&&cmp.size)?'flex':'none';
 if(v==='fav')renderFav();if(v==='market')renderMarket();if(v==='multi')renderMulti();if(v==='inst')renderInst()}
document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
render();
</script>
<div id="boot" style="position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:var(--paper);color:var(--mute);z-index:50">Загружаю каталог…</div>
<div class="sendbar" id="sendbar"><span id="sendn"></span><button class="btn" id="sendgo">Отправить боту</button></div>
<script>
(function(){
const tg=window.Telegram&&Telegram.WebApp, inTg=!!(tg&&tg.initData), root=document.documentElement;
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
if(tg){tg.ready();tg.expand();
 const theme=()=>{if(tg.colorScheme)root.dataset.theme=tg.colorScheme;
  try{const bg=getComputedStyle(root).getPropertyValue('--paper').trim();tg.setHeaderColor(bg);tg.setBackgroundColor(bg)}catch(e){}};
 theme();tg.onEvent&&tg.onEvent('themeChanged',theme)}
const boot=document.getElementById('boot'), fail=t=>{boot.textContent=t};
// внутри Telegram внешние ссылки открываются через Telegram, иначе их молча глотает встроенный браузер
const open=h=>{if(!inTg)return window.open(h,'_blank');if(/^https:\/\/t\.me\//.test(h))tg.openTelegramLink(h);else tg.openLink(h)};
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a||!inTg)return;
 const h=a.href;if(/^https:\/\/t\.me\//.test(h)||(/^https?:/.test(h)&&a.target==='_blank')){e.preventDefault();open(h)}},true);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const k=new URLSearchParams(location.search).get('k');
if(!k){fail('Откройте каталог кнопкой «Каталог» в боте.');return}
if(!window.crypto||!crypto.subtle||!window.DecompressionStream){fail('Этот браузер слишком старый для каталога. Обновите Telegram или откройте ссылку в Chrome/Safari.');return}
const raw=Uint8Array.from(atob(k.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));

/* облако Telegram (CloudStorage): заметки и неотправленные отметки видны на всех устройствах; вне Telegram — память браузера */
const CS=tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9')?tg.CloudStorage:null;
const cs=(fn,...a)=>new Promise(res=>{if(!CS)return res(null);const t=setTimeout(()=>res(null),2000);
 try{CS[fn](...a,(err,v)=>{clearTimeout(t);res(err?null:v)})}catch(e){clearTimeout(t);res(null)}});
async function loadNotes(){const local=ls.get('carmon_notes',{});if(!CS)return local;
 const keys=((await cs('getKeys'))||[]).filter(k=>k.startsWith('n_'));if(!keys.length)return local;
 const vals=(await cs('getItems',keys))||{};const out={...local};
 for(const [k,v] of Object.entries(vals))if(v)out[parseInt(k.slice(2),36)]=v;return out}
async function loadInsp(){const local=ls.get('carmon_insp_rid',{});if(!CS)return local;
 const keys=((await cs('getKeys'))||[]).filter(k=>k.startsWith('i_'));if(!keys.length)return local;
 const vals=(await cs('getItems',keys))||{};const out={...local};
 for(const [k,v] of Object.entries(vals))if(v)try{out[parseInt(k.slice(2),36)]=JSON.parse(v)}catch(e){}return out}
function saveInsp(rid,d){const a=ls.get('carmon_insp_rid',{});if(d)a[rid]=d;else delete a[rid];ls.set('carmon_insp_rid',a);
 const k='i_'+(+rid).toString(36);if(d)cs('setItem',k,JSON.stringify(d).slice(0,4000));else cs('removeItem',k)}
const store={async get(k){const v=await cs('getItem','s_'+k);if(v)try{return JSON.parse(v)}catch(e){}return ls.get('carmon_s_'+k,null)},
 set(k,v){ls.set('carmon_s_'+k,v);cs('setItem','s_'+k,JSON.stringify(v).slice(0,4000))}};
function saveNote(rid,text){const n=ls.get('carmon_notes',{});if(text)n[rid]=text;else delete n[rid];ls.set('carmon_notes',n);
 const k='n_'+(+rid).toString(36);if(text)cs('setItem',k,text.slice(0,4000));else cs('removeItem',k)}

/* отметки: видны сразу, боту уходят ссылкой t.me/бот?start=mk_…, программа применит их при следующем запуске */
const CODE={fav:'f',called:'c',seen:'s',no:'n',hide:'h'}, PK='carmon_pending', DAY=864e5;
let pend=ls.get(PK,{});
const savePend=()=>{ls.set(PK,pend);const v=JSON.stringify(pend);if(v.length<4000)cs('setItem','pend',v)};
async function loadPend(){const c=await cs('getItem','pend');if(!c)return;try{   // свежее по времени — главнее
 for(const [rid,e] of Object.entries(JSON.parse(c)))if(!pend[rid]||pend[rid].ts<e.ts)pend[rid]=e}catch(e){}}
function mergePending(rows){const by={};rows.forEach(r=>{if(r.rid)by[r.rid]=r});const now=Date.now();
 for(const [rid,e] of Object.entries(pend)){const r=by[rid];
  if(!r||(e.sent&&now-e.ts>3*DAY)){if(r||now-e.ts>14*DAY)delete pend[rid];continue}   // бот так и не применил — не врём
  r.marks=r.marks||[];
  for(const [m,on] of Object.entries(e.marks)){if(r.marks.includes(m)===on){if(e.sent)delete e.marks[m]}else r.marks=on?[...r.marks,m]:r.marks.filter(x=>x!==m)}
  if(!Object.keys(e.marks).length)delete pend[rid]}
 savePend()}
function bar(){const n=Object.values(pend).filter(e=>!e.sent).length,b=document.getElementById('sendbar');
 b.style.display=n&&window.CAT&&CAT.bot?'flex':'none';document.getElementById('sendn').textContent='Новых отметок: '+n}
function send(){const items=Object.entries(pend).filter(([,e])=>!e.sent);let payload='mk';const done=[];
 for(const [rid,e] of items){const t=Object.entries(e.marks).map(([m,on])=>'_'+(+rid).toString(36)+(on?CODE[m]:CODE[m].toUpperCase())).join('');
  if((payload+t).length>64)break;payload+=t;done.push(rid)}
 if(!done.length)return;done.forEach(rid=>{pend[rid].sent=true});savePend();
 open('https://t.me/'+CAT.bot+'?start='+payload);bar();
 if(items.length>done.length)setTimeout(()=>{document.getElementById('sendn').textContent='Осталось отправить: '+(items.length-done.length)},300)}
document.getElementById('sendgo').onclick=send;

(async()=>{
 const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 let res;try{res=await fetch('data.bin?t='+Date.now(),{cache:'no-store'})}
 catch(e){throw new Error('нет связи, а сохранённой копии каталога на этом устройстве ещё нет')}
 if(!res.ok)throw new Error('каталог ещё не выложен ('+res.status+')');
 const offline=res.headers.get('x-carmon-offline');
 const buf=new Uint8Array(await res.arrayBuffer());
 let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12))}
 catch(e){throw new Error('ключ не подходит — откройте каталог заново кнопкой в боте')}
 const txt=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 const d=JSON.parse(txt);
 const [notes,insp]=await Promise.all([loadNotes(),loadInsp(),loadPend()]);
 d.rows.forEach(r=>{if(r.rid&&notes[r.rid])r.note=notes[r.rid];if(r.rid&&insp[r.rid])r.insp=insp[r.rid]});
 mergePending(d.rows);
 window.DATA=d.rows;window.STATS=d.stats;window.UPDATED=d.updated;
 window.CAT={bot:d.bot||'',open,store,note(r,text){if(r.rid)saveNote(r.rid,text)},insp(r,v){if(r.rid)saveInsp(r.rid,v)},
  toggle(r,m,on){const e=pend[r.rid]=pend[r.rid]||{marks:{},ts:0};e.marks[m]=on;e.sent=false;e.ts=Date.now();savePend();bar()}};
 const s=document.createElement('script');s.textContent=document.getElementById('app').textContent;document.body.appendChild(s);
 if(tg&&tg.BackButton){const o=window.openM,c=window.closeM;   // системная «Назад» закрывает карточку
  window.openM=function(){o.apply(this,arguments);tg.BackButton.show()};
  window.closeM=function(){c.apply(this,arguments);tg.BackButton.hide()};
  tg.BackButton.onClick(()=>window.closeM())}
 if(offline)document.getElementById('warn').insertAdjacentHTML('afterbegin',
  '<div class="warnline">Нет связи — показан каталог, сохранённый на этом устройстве (от '+String(d.updated).replace(/[<>&]/g,'')+').</div>');
 bar();boot.remove();
})().catch(e=>fail('Не удалось открыть каталог: '+e.message));
})();
</script>
</body></html>
